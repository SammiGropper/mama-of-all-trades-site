<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/img/logo.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% seo %}
</head>
<body>

<nav class="nav">
  <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/logo.png' | relative_url }}" alt="">Mama of All Trades</a>
  <div class="links">
    <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
    <a href="{{ '/offers/' | relative_url }}" {% if page.url == '/offers/' %}class="active"{% endif %}>Consults</a>
    <a href="{{ '/resources/' | relative_url }}" {% if page.url == '/resources/' %}class="active"{% endif %}>Free Guides</a>
    <a href="{{ '/real-estate/' | relative_url }}" {% if page.url == '/real-estate/' %}class="active"{% endif %}>Real Estate</a>
    <a href="{{ '/podcast/' | relative_url }}" {% if page.url == '/podcast/' %}class="active"{% endif %}>Podcast</a>
    <a href="{{ '/books/' | relative_url }}" {% if page.url == '/books/' %}class="active"{% endif %}>Books</a>
    <a href="{{ '/discounts/' | relative_url }}" {% if page.url == '/discounts/' %}class="active"{% endif %}>Discounts</a>
    <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a>
  </div>
</nav>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer class="site-footer">
  <div class="footer-links">
    <a href="{{ '/testimonials/' | relative_url }}">Testimonials</a>
    <a href="{{ '/lactation-favorites/' | relative_url }}">Lactation Favorites</a>
    <a href="{{ '/community/' | relative_url }}">Community</a>
    <a href="https://calendly.com/mamaofalltrades1" target="_blank" rel="noopener">Book a Consult</a>
  </div>
  <p>
    <a href="https://instagram.com/sammigropper" target="_blank" rel="noopener">@sammigropper on Instagram</a><br>
    &copy; {{ 'now' | date: "%Y" }} Mama of All Trades
  </p>
</footer>
</body>
</html>
