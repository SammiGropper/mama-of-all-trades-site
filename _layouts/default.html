<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% seo %}
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <div class="header-row">
      <a class="site-title" href="{{ '/' | relative_url }}">Mama of All Trades</a>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu ☰</button>
    </div>
    <nav class="site-nav" id="site-nav">
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
      <a href="{{ '/offers/' | relative_url }}" {% if page.url == '/offers/' %}class="active"{% endif %}>Offers</a>
      <a href="{{ '/books/' | relative_url }}" {% if page.url == '/books/' %}class="active"{% endif %}>Books</a>
      <a href="{{ '/testimonials/' | relative_url }}" {% if page.url == '/testimonials/' %}class="active"{% endif %}>Testimonials</a>
      <a href="{{ '/lactation-favorites/' | relative_url }}" {% if page.url == '/lactation-favorites/' %}class="active"{% endif %}>Lactation Favorites</a>
      <a href="{{ '/resources/' | relative_url }}" {% if page.url == '/resources/' %}class="active"{% endif %}>Resources</a>
      <a href="{{ '/podcast/' | relative_url }}" {% if page.url == '/podcast/' %}class="active"{% endif %}>Podcast</a>
      <a href="{{ '/community/' | relative_url }}" {% if page.url == '/community/' %}class="active"{% endif %}>Community</a>
      <a href="{{ '/real-estate/' | relative_url }}" {% if page.url == '/real-estate/' %}class="active"{% endif %}>Real Estate</a>
      <a href="{{ '/discounts/' | relative_url }}" {% if page.url == '/discounts/' %}class="active"{% endif %}>Discounts</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      <a href="https://instagram.com/sammigropper" target="_blank" rel="noopener">@sammigropper on Instagram</a>
      &middot; &copy; {{ 'now' | date: "%Y" }} Mama of All Trades
    </p>
  </div>
</footer>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var isOpen = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      btn.textContent = isOpen ? 'Close ✕' : 'Menu ☰';
    });
  });
</script>
</body>
</html>
